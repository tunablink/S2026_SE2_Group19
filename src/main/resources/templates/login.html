<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/navbar_guest :: navbar_guest}"></div>

    <main class="login-page">
      <div class="login-layout">
        <section class="login-card">
          <header class="login-card__header">
            <h1 class="login-card__title">Login</h1>
            <p class="login-card__subtitle">
              Welcome back! Sign in to your account.
            </p>
          </header>

          <form class="login-form" id="login-form">
            <label class="form-field">
              <span class="form-field__label">Username or email</span>
              <input
                class="form-field__input"
                type="text"
                name="username"
                placeholder="example@example.com"
                autocomplete="email"
              />
            </label>

            <label class="form-field">
              <span class="form-field__label">Password</span>
              <div class="form-field__password">
                <input
                  class="form-field__input"
                  type="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />
              </div>
            </label>

            <div class="recaptcha">
              <div class="recaptcha__box">
                <div class="recaptcha__left">
                  <div class="recaptcha__checkbox"></div>
                  <span class="recaptcha__text">I'm not a robot</span>
                </div>
                <div class="recaptcha__right">
                  <div class="recaptcha__logo"></div>
                  <span class="recaptcha__brand">reCAPTCHA</span>
                </div>
              </div>
              <p class="recaptcha__meta">
                <a class="recaptcha__meta-link" href="#">Privacy</a>
                <span class="recaptcha__meta-dot">·</span>
                <a class="recaptcha__meta-link" href="#">Terms</a>
              </p>
            </div>

            <button class="login-submit" type="submit">Log in</button>

            <div class="login-divider">
              <span class="login-divider__line"></span>
              <span class="login-divider__text">Or</span>
              <span class="login-divider__line"></span>
            </div>

            <div class="social-auth">
              <button class="social-auth__btn" type="button">
                <span class="social-auth__icon">
                  <img th:src="@{/images/google.png}" alt="" />
                </span>
                Continue with Google
              </button>

              <button class="social-auth__btn" type="button">
                <span class="social-auth__icon">
                  <img th:src="@{/images/linkedin.png}" alt="" />
                </span>
                Continue with LinkedIn
              </button>

              <button class="social-auth__btn" type="button">
                <span class="social-auth__icon">
                  <img th:src="@{/images/key.png}" alt="" />
                </span>
                Continue with SSO
              </button>
            </div>

            <div class="login-help">
              <span class="login-help__text">Having trouble logging in?</span>
              <a class="login-help__link" href="#">Send magic link</a>
            </div>

            <footer class="login-footer">
              <span>New here?</span>
              <a class="login-footer__link" th:href="@{/register}">Sign up</a>.
            </footer>
          </form>
        </section>
      </div>
    </main>
    
    <script>
      const auth_key = "auth-key";
      const form = document.getElementById('login-form');

      function showLoginError(message) {
          let errorElement = document.getElementById('login-error');
          
          if (!errorElement) {
              errorElement = document.createElement('p');
              errorElement.id = 'login-error';
              errorElement.style.color = 'red';
              errorElement.style.textAlign = 'center';
              const submitButton = form.querySelector('.login-submit');
              form.insertBefore(errorElement, submitButton);
          }
          
          errorElement.textContent = message || '';
      }

      function clearLoginError() {
          const errorElement = document.getElementById('login-error');
          if (errorElement) {
              errorElement.textContent = '';
          }
      }

      form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const usernameInput = form.querySelector('input[name="username"]');
          const passwordInput = form.querySelector('input[name="password"]');
          const username = usernameInput.value;
          const password = passwordInput.value;

          clearLoginError();

          try {
              const response = await fetch('/auth/login', {
                  method: 'POST',
                  credentials: 'include',
                  headers: {
                      'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ username, password }),
              });

              if (response.ok) {
                  const data = await response.json();
                  localStorage.setItem(auth_key, data.token);
                  window.location.href = '/learn';
              } else {
                  const errorData = await response.json().catch(() => ({ 
                      message: 'Login failed. Please check your credentials.' 
                  }));
                  showLoginError(errorData.message || 'An unknown error occurred.');
                  console.error('Login failed:', response.status, response.statusText, errorData);
              }
          } catch (error) {
              showLoginError('Error communicating with the server.');
              console.error('Error during login:', error);
          }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Update Profile</title>
    <link rel="stylesheet" th:href="@{/css/register.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar_user :: navbar_user}"></div>

    <main class="login-page">
        <div class="login-layout">
            <section class="login-card">
                <header class="login-card__header">
                    <h1 class="login-card__title">Update Profile</h1>
                    <p class="login-card__subtitle">Enter the new details for your account.</p>
                </header>

                <form class="login-form" th:action="@{/member/profile/edit}" th:object="${profile}" method="post">
                    <label class="form-field">
                        <span class="form-field__label">Username</span>
                        <input class="form-field__input" type="text" th:field="*{username}" placeholder="Enter your username" autocomplete="username" />
                    </label>
                    <small th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: #dc2626; margin-top: -8px; display: block;"></small>

                    <label class="form-field">
                        <span class="form-field__label">Email</span>
                        <input class="form-field__input" type="email" th:field="*{email}" placeholder="Enter your email" autocomplete="email" />
                    </label>
                    <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: #dc2626; margin-top: -8px; display: block;"></small>

                    <label class="form-field">
                        <span class="form-field__label">Address</span>
                        <input class="form-field__input" type="text" th:field="*{address}" placeholder="Enter your address" autocomplete="street-address" />
                    </label>
                    <small th:if="${#fields.hasErrors('address')}" th:errors="*{address}" style="color: #dc2626; margin-top: -8px; display: block;"></small>

                    <button class="login-submit" type="submit">Update Profile</button>

                    <footer class="login-footer">
                        <a class="login-footer__link" th:href="@{/member/home}">Back to Profile</a>
                    </footer>
                </form>
            </section>
        </div>
    </main>
</body>
</html>

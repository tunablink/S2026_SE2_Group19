<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:replace="${title} ?: _">OWASP Web App</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    
    <!-- Base styles, could add common css here later -->
    <style>
        .alert-messages {
            margin: 1rem auto;
            max-width: 800px;
            padding: 0 1rem;
        }
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    
    <!-- Navbar (Will be injected by pages dynamically) -->
    
    <!-- Global Alerts -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    
    <!-- Main Content -->
    <main th:replace="${content}">
        <p>Default Content</p>
    </main>

    <!-- Footer could be added here -->

</body>
</html>

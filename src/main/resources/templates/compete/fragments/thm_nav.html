<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- /* active: dashboard | learn | practice | compete */ -->
<nav class="thm-nav" th:fragment="thm_nav (active)">
  <div class="thm-nav__container">
    <a class="thm-nav__logo" th:href="@{/learn}" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="12" r="10" opacity="0.2"/>
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </a>

    <div class="thm-nav__menu">
      <a th:href="@{/dashboard}" class="thm-nav__link" th:classappend="${active=='dashboard'} ? 'thm-nav__link--active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2" ry="2"></rect>
          <path d="M8 20h8"></path>
          <path d="M12 16v4"></path>
        </svg>
        <span>Dashboard</span>
      </a>

      <a th:href="@{/learn}" class="thm-nav__link" th:classappend="${active=='learn'} ? 'thm-nav__link--active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span>Learn</span>
      </a>

      <a th:href="@{/lab}" class="thm-nav__link" th:classappend="${active=='practice'} ? 'thm-nav__link--active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 3H5a2 2 0 0 0-2 2v4"></path>
          <path d="M15 3h4a2 2 0 0 1 2 2v4"></path>
          <path d="M9 21H5a2 2 0 0 1-2-2v-4"></path>
          <path d="M15 21h4a2 2 0 0 0 2-2v-4"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <span>Practice</span>
      </a>

      <a th:href="@{/compete}" class="thm-nav__link" th:classappend="${active=='compete'} ? 'thm-nav__link--active'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
          <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
          <path d="M4 22h16"></path>
          <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path>
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path>
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>
        </svg>
        <span>Compete</span>
      </a>
    </div>

    <div class="thm-nav__actions">
      <button type="button" class="thm-nav__icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
      </button>
      <button type="button" class="thm-nav__icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
      </button>
      <a th:href="@{/member/home}" aria-label="Profile">
        <img class="thm-nav__avatar" th:src="@{/images/user-avatar.png}" alt="" />
      </a>
      <button type="button" class="thm-nav__logout" id="logout-thm">Logout</button>
    </div>
  </div>
  <script>
    (function () {
      var b = document.getElementById('logout-thm');
      if (b) b.addEventListener('click', function (e) {
        e.preventDefault();
        try { localStorage.removeItem('auth-key'); } catch (x) {}
        window.location.href = '/login';
      });
    })();
  </script>
</nav>
</body>
</html>

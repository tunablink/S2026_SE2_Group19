<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compete - Rewards</title>
  <link rel="stylesheet" th:href="@{/css/user_nav.css}" />
  <link rel="stylesheet" th:href="@{/compete-static/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/compete-static/compete-overrides.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar_user :: navbar_user}"></div>

<main class="thm-main">
  <section class="thm-card">
    <h1 class="thm-page-title">Your Rewards</h1>
    <p class="thm-hint-error" th:if="${competeLoadError != null}" th:text="${competeLoadError}">Load error</p>
    <div th:replace="~{fragments/alerts :: alerts}"></div>
    <p class="thm-stats__subtext">Rewards can only be claimed within 14 days after the tournament week closes.</p>

    <div th:if="${!rewards.isEmpty()}">
      <div class="thm-reward-row" th:each="r : ${rewards}">
        <div>
          <strong th:text="${r.title}">Weekly Tournament - Participant</strong>
          <p class="thm-stats__subtext" th:text="|Tier: ${r.tier}|">Tier: PARTICIPANT</p>
          <p class="thm-stats__subtext" th:text="|Status: ${r.status}|">Status: PENDING</p>
          <p class="thm-stats__subtext" th:if="${r.expiresAt != null}" th:text="|Expires: ${r.expiresAt}|">Expires: 2026-04-20T00:00:00Z</p>
        </div>
        <form th:if="${r.status.toString() == 'PENDING'}" th:action="@{/compete/rewards/{id}/claim(id=${r.id})}" method="post">
          <button type="submit" class="thm-intro__btn">Claim</button>
        </form>
      </div>
    </div>

    <p class="thm-empty" th:if="${rewards.isEmpty()}">No rewards yet.</p>

    <div class="thm-row-actions">
      <a class="thm-link-btn thm-link-btn--ghost" th:href="@{/compete}">&larr; Back to Compete</a>
    </div>
  </section>
</main>

</body>
</html>

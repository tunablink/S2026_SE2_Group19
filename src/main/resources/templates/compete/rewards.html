<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compete - Rewards</title>
  <link rel="stylesheet" th:href="@{/css/user_nav.css}" />
  <link rel="stylesheet" th:href="@{/compete-static/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/compete-static/compete-overrides.css}" />
</head>
<body>
<div th:replace="~{fragments/navbar_user :: navbar_user}"></div>

<main class="thm-main">
  <section class="thm-card">
    <h1 class="thm-page-title">Your Rewards</h1>
    <p class="thm-hint-error" th:if="${competeLoadError != null}" th:text="${competeLoadError}">Load error</p>
    <p class="thm-stats__subtext">Rewards can only be claimed within 14 days after the tournament week closes.</p>

    <div th:if="${!rewards.isEmpty()}">
      <div class="thm-reward-row" th:each="r : ${rewards}">
        <div>
          <strong th:text="${r.tier}">TIER</strong>
          <p class="thm-stats__subtext" th:text="${r.payload}">{}</p>
          <p class="thm-stats__subtext" th:text="|Status: ${r.status}|">Status: PENDING</p>
        </div>
        <button
          type="button"
          class="thm-intro__btn rw-claim"
          th:if="${r.status.toString() == 'PENDING'}"
          th:attr="data-id=${r.id}">
          Claim
        </button>
      </div>
    </div>

    <p class="thm-empty" th:if="${rewards.isEmpty()}">No rewards yet.</p>

    <div class="thm-row-actions">
      <a class="thm-link-btn thm-link-btn--ghost" th:href="@{/compete}">&larr; Back to Compete</a>
    </div>
  </section>
</main>

<script th:inline="javascript">
  var claimBase = /*[[@{/api/compete/rewards/}]]*/ '/api/compete/rewards/';
  document.querySelectorAll('.rw-claim').forEach(function (btn) {
    btn.addEventListener('click', async function () {
      var id = btn.getAttribute('data-id');
      btn.disabled = true;
      try {
        var response = await fetch(claimBase + id + '/claim', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          location.reload();
          return;
        }
      } catch (error) {
      }
      btn.disabled = false;
    });
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Reset password</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/navbar_guest :: navbar_guest}"></div>

    <main class="login-page">
      <div class="login-layout">
        <section class="login-card">
          <header class="login-card__header">
            <h1 class="login-card__title">Reset password</h1>
            <p class="login-card__subtitle" th:if="${not invalidToken}">
              Choose a new password for your account.
            </p>
            <p class="login-card__subtitle" th:if="${invalidToken}">
              This link is missing or invalid. Open the link from your email, or request a new reset from Forgot password.
            </p>
          </header>

          <!-- Invalid / missing token -->
          <div th:if="${invalidToken}" class="auth-banner auth-banner--warn" role="alert">
            Add a valid <code style="color: inherit">?token=</code> query to preview the reset form (e.g. from an email link).
          </div>

          <div th:if="${invalidToken}" class="login-form" style="margin-top: 8px">
            <a class="login-submit" th:href="@{/forgot-password}" style="text-align: center">Forgot password</a>
            <footer class="login-footer">
              <a class="login-footer__link" th:href="@{/login}">Back to login</a>
            </footer>
          </div>

          <!-- Valid token: new password + confirm (backend will validate token server-side later) -->
          <form
            th:if="${not invalidToken}"
            class="login-form"
            th:action="@{/reset-password}"
            method="post"
            id="reset-form"
          >
            <input type="hidden" name="token" th:value="${token}" />

            <label class="form-field">
              <span class="form-field__label">New password</span>
              <input
                class="form-field__input"
                type="password"
                name="newPassword"
                autocomplete="new-password"
                placeholder="Enter a new password"
                required
                minlength="8"
              />
            </label>

            <label class="form-field">
              <span class="form-field__label">Confirm new password</span>
              <input
                class="form-field__input"
                type="password"
                name="confirmPassword"
                autocomplete="new-password"
                placeholder="Re-enter new password"
                required
                minlength="8"
              />
            </label>

            <button class="login-submit" type="submit">Update password</button>

            <footer class="login-footer">
              <a class="login-footer__link" th:href="@{/login}">Back to login</a>
            </footer>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
